[package]
name = "privacy-pools"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
zk = { path = "../libs/zk" }
lean-imt = { path = "../libs/lean-imt" }
ark-ff = { version = "0.4.2", default-features = false }
ark-bls12-381 = { version = "0.4.0", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ark-bls12-381 = { version = "0.4.0" }
ark-serialize = { version = "0.4.2" }
ark-ff = { version = "0.4.2" }
ark-ec = { version = "0.4.2" }
# Test-only: build a genuine Groth16 proof for a pool denomination the
# checked-in circom fixtures do not cover (see `denomination_tests` in test.rs).
ark-groth16 = { version = "0.4.0", default-features = false }
ark-relations = { version = "0.4.0", default-features = false }
ark-snark = { version = "0.4.0", default-features = false }
ark-std = { version = "0.4.0", default-features = false, features = ["std"] }
hex = { version = "0.4.3" }

[features]
default = []
